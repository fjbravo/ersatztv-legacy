name: BYLab GHCR Image

on:
  workflow_dispatch:
  push:
    branches:
      - feat/jellyfin-media-segment-skip

permissions:
  contents: read
  packages: write

jobs:
  build_amd64:
    name: Build amd64 image for BYLab
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[no build]') == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ErsatzTV Next channel binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download develop --repo ErsatzTV/next --pattern "ersatztv-next-*-linux-x64.tar.gz" --dir next-download
          mkdir next-extracted
          tar xzvf next-download/*.tar.gz -C next-extracted --strip-components 1
          mv next-extracted/ersatztv-channel .
          rm -rf next-download next-extracted

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ersatztv-legacy
          tags: |
            type=sha,prefix=jellyfin-segments-mvp-
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          build-args: |
            INFO_VERSION=jellyfin-segments-mvp-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
